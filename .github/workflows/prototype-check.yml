# 原型检查：与本地 `npm run check` 同一条命令（类型 · lint · 格式）。
name: 原型检查

on:
  push:
    branches: [main]
    paths: ['原型/**', '.github/workflows/prototype-check.yml']
  pull_request:
    paths: ['原型/**', '.github/workflows/prototype-check.yml']

defaults:
  run:
    working-directory: 原型

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 原型/package-lock.json
      - run: npm ci
      - run: npm run check
